<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Tulis tugas baru...">
      <button id="addBtn">Tambah</button>
    </div>
    <div class="filters">
      <button class="filter active" data-filter="all">Semua</button>
      <button class="filter" data-filter="active">Aktif</button>
      <button class="filter" data-filter="done">Selesai</button>
    </div>
    <ul id="taskList"></ul>
    <p id="counter" class="counter"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
